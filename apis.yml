aid: tortus
name: Tortus
description: >-
  TORTUS is a healthcare AI company whose ambient voice technology (AVT) platform
  automatically transcribes and documents clinical consultations. It captures
  speaker-diarized, locally-encrypted audio, generates structured clinical notes,
  letters and referrals, suggests diagnostic and procedural codes, and files
  findings into the electronic health record after clinician approval. TORTUS is
  live across 1,000+ NHS organisations with 2.5M+ consultations processed and
  integrates with Epic, EMIS Health, TPP SystmOne, Oracle Health, Access Rio and
  Medicus. Developers embed the experience with the TORTUS Embed SDK
  (@tortus-ai/embed-client), a TypeScript client that mounts a sandboxed iframe
  and authenticates via short-lived launch tokens minted server-side against the
  api.tortus.ai launch endpoint. TORTUS is a UKCA Class IIa medical device with
  ISO 27001, ISO 13485, Cyber Essentials Plus, NHS DTAC and DSPT posture.
